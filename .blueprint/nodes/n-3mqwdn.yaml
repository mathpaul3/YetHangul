title: 붙여넣기 정규화
parent: n-mr2cb0
status: active
explanation: |
  붙여넣은 한글·옛한글 문자열을 엔진의 입력 심볼 시퀀스로 바꾸는 처리. 키 입력을 받는 경로는 "입력 수집 파이프라인"에 있다.
decisions:
  - id: d-t6exxs
    kind: product
    question: 붙여넣은 문자열을 어떻게 받아들이는가
    chosen: compatibility jamo, conjoining jamo, 현대 한글 완성형을 지원하고, 가능하면 input symbol sequence로 정규화한다. 복합 중성과 겹받침도 단일 문자로 두지 않고 입력 심볼 시퀀스로 펼친다
    status: accepted
