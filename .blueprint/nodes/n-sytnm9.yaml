title: 음절 경계와 재분석
parent: n-mr2cb0
status: active
explanation: |
  입력 중에 음절이 어디서 끊기는지에 관한 처리로, 종성을 다음 음절의 초성으로 넘기는 재분석과 조합되지 않는 모음의 처리가 여기 있다. 마지막 입력 단계를 되돌리는 backspace의 기본 동작은 이 노드 밖에 있다(d-pgtceh).
decisions:
  - id: d-pz9asz
    kind: product
    question: 종성 뒤에 모음이 입력되면 어떻게 하는가
    chosen: 마지막 종성 자음을 다음 음절의 초성으로 재분석한다. 복합 종성이면 마지막 자음만 떼어내고 나머지는 앞 음절에 남긴다
    status: accepted
  - id: d-yw869e
    kind: product
    question: 재분석 직후 입력한 모음을 지우면 어떻게 되는가
    chosen: 재분석 이전 상태로 되돌린다
    status: accepted
  - id: d-h226h8
    kind: product
    question: 완성된 초중성 뒤에 조합되지 않는 모음이 오면 어떻게 하는가
    chosen: 기존 중성을 덮어쓰지 않는다. 현재 음절을 commit하고 초성 채움 + 새 모음으로 새 음절을 시작한다
    rationale: 조합되지 않는 추가 입력이 기존 음절을 덮어쓰지 않아야 사용자가 놀라지 않는다 (최소 surprise 기준)
    status: accepted
constraints:
  - id: c-0a98yq
    kind: product
    statement: 재분석은 종성을 다음 음절 초성으로 넘기는 것 같은 국소 음절 전이로만 한정한다
qa:
  - id: q-fzxbb0
    condition: 종성 뒤에 모음을 입력하면 마지막 종성 자음이 다음 음절 초성으로 옮겨지고, 그 모음을 지우면 옮기기 전 상태로 돌아온다
    verifies: [d-pz9asz, d-yw869e, d-pgtceh]
    tests: [src/engine/tests/engine.test.ts]
  - id: q-9c2w86
    condition: ㄴ + ㄱ + ㅏ + ㅏ + ㅊ 입력이 ᄓᅡᅟᅡᆾ가 된다
    verifies: [d-h226h8]
    tests: [src/engine/tests/engine.test.ts]
implementation:
