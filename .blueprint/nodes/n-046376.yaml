title: 중복 입력 억제
parent: n-r6q7ge
status: active
explanation: |
  같은 입력이 직접 키 dispatch와 브라우저 이벤트(beforeinput, compositionend)로 두 번 들어올 때 한 번만 반영하는 처리. 하드웨어 키 해석 자체는 형제 노드 "하드웨어 키보드"에 있다.
decisions:
  - id: d-3md9py
    kind: product
    question: direct key dispatch 직후 들어오는 같은 문자의 beforeinput이나 compositionend는 어떻게 하는가
    chosen: 짧은 suppression window 안에서 억제한다. 같은 기본 키에서 파생된 Shift, Ctrl 변형도 같은 입력으로 보고 억제한다
    rationale: beforeinput과 compositionend가 같은 조합 결과를 중복 전달하는 브라우저가 있기 때문이다
    status: accepted
qa:
  - id: q-scserm
    condition: 온스크린 R Ctrl + R Shift + ㅅ 뒤에 들어오는 ㅅ, ㅆ 계열 native text가 중복 반영되지 않는다
    verifies: [d-3md9py]
    tests: [src/features/ime/services/inputInterop.test.ts]
  - id: q-h8kgh2
    condition: 중복 억제가 쓰는 기본 키 매핑이 Modifier 규칙(n-bf2mwe)의 파생 관계와 같다. 예를 들어 ᅀ의 기본 키는 ㅁ이다
    verifies: [d-hyxyxw]
    tests: [src/features/ime/services/inputInterop.test.ts]
implementations:
  - id: i-sgvywt
    name: 중복 입력 억제
    status: in-progress
    plan: |
