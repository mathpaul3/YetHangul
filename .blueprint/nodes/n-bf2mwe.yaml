title: Modifier 규칙
parent: n-tqpxap
status: active
explanation: |
  L/R Ctrl, L/R Shift와 그 조합이 어떤 자모나 연산을 내는지에 관한 규칙. 이 규칙을 화면에 보여주거나 따로 해석하는 키캡 미리보기, 중복 입력 억제, 하드웨어 키보드는 "입력 수집 파이프라인" 아래에 있고 QA 조건으로 이 노드에 연결된다.
decisions:
  - id: d-hyxyxw
    kind: product
    question: 반치음(ᅀ)은 어떤 키로 입력하는가
    options:
      - id: o-hcdxa3
        text: 반치음(ᅀ)은 L Ctrl + ㅁ으로 입력한다
        status: accepted
      - id: o-hbbqx2
        text: 반치음(ᅀ)은 R Ctrl + ㅁ으로 입력한다
        status: accepted
      - id: o-jk3yt8
        text: Shift + ㅊ는 다른 특수 규칙이 없는 Shift 조합처럼 동작한다
        status: accepted
        reason: Ctrl = 자형 변환 원칙의 예외였다. v0.2.3에서 Ctrl + ㅁ으로 바꿨다 (REQ-V023-003)
    rationale: |
      UX 개선을 위해 Ctrl = 자형 변환 원칙에 맞추고 반치음 예외를 없앤다 (REQ-V023-003)
    status: accepted
  - id: d-vnq5bs
    kind: product
    question: Shift + ㅁ은 어떻게 해석하는가
    options:
      - id: o-y0vvtf
        text: Shift + ㅁ은 문맥형 filler 매크로다
        status: accepted
      - id: o-zr4j1n
        text: 초성만 있으면 Shift + ㅁ은 중성 채움 + 쌍미음이다
        status: accepted
      - id: o-5c1png
        text: 초중성이 있으면 Shift + ㅁ은 쌍미음이다
        status: accepted
      - id: o-cjdphz
        text: 입력이 없거나 종성까지 있으면 Shift + ㅁ은 초성 채움 + 중성 채움 + 쌍미음이다
        status: accepted
    status: accepted
  - id: d-vh2tb9
    kind: product
    question: Ctrl + Space는 어떻게 해석하는가
    options:
      - id: o-8x9m0v
        text: Ctrl + Space는 문맥형 filler 연산이다
        status: accepted
      - id: o-asnbkm
        text: Ctrl + Space는 종성 뒤 모음을 이어쓰지 않고 끊어쓸 때도 쓴다
        status: accepted
      - id: o-a3yrxm
        text: Ctrl 없는 Space는 일반 공백이다
        status: accepted
    status: accepted
qa:
  - id: q-fwkkyp
    condition: 온스크린과 하드웨어 모두 L/R Ctrl + ㅁ은 ᅀ를 내고, Shift + ㅊ는 ᅀ를 내지 않는다
    verifies: [d-hyxyxw]
    tests: [src/engine/tests/engine.test.ts]
  - id: q-hzp97x
    condition: Shift + ㅁ이 초성만, 초중성, 중성만, 빈 상태, literal 뒤, 완성 음절 뒤에서 각각 정의된 결과를 내고, backspace 한 번에 통째로 취소된다
    verifies: [d-vnq5bs, d-pgtceh]
    tests: [src/engine/tests/engine.test.ts]
implementations:
  - id: i-tvq8c6
    name: Modifier 규칙
    status: in-progress
    plan: |
      v0.2.3에서 반치음 입력 키가 Shift + ㅊ에서 Ctrl + ㅁ으로 바뀌었다(REQ-V023-003).
      TASK-V023-001: 엔진 modifier 해석에 L/R Ctrl + ㅁ → ᅀ를 추가하고 Shift + ㅊ → ᅀ를 제거한다.
      Ctrl + Shift + ㅁ은 Ctrl 우선 원칙에 따라 ᅀ, Ctrl + Shift + ㅊ은 L/R Ctrl + ㅊ 결과를 낸다.
      feat/v0.2.3에 반영됐고 main 머지를 기다린다.
      main에는 아직 Shift + ㅊ 구현과 테스트("maps shift + chieuch to banchieum")가 남아 있다.
    refs:
      - path: src/engine/tables/inputSymbolTable.ts
      - path: src/features/ime/services/modifierInteraction.ts
