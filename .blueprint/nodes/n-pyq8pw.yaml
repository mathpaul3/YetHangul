decisions:
  - id: d-rr9gsa
    question: 입력 결과창의 편집 모델은 무엇인가
    chosen: 입력기 위에 document units + caret index + selection range 레이어를 둔다. 브라우저 기본 selection은 가능한 한 배제하고, 자체 selection과 Copy All, Copy Selection 버튼을 우선한다
    status: accepted
  - id: d-jw893q
    question: 편집기에서 포커스가 빠지면 조합 중이던 내용은 어떻게 되는가
    chosen: composition buffer를 먼저 document에 commit하고, 그 뒤 하드웨어 상호작용 상태와 최근 IME 중복 표시를 초기화한다
    status: accepted
