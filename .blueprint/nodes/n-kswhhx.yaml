title: 온스크린 키보드
parent: n-r6q7ge
status: active
explanation: |
  앱이 화면에 그리는 자체 가상 키보드(배열, 버튼, 펼침 상태, modifier 버튼). 하위에 키캡 미리보기와 도움말 규칙표가 있고, 키가 무엇을 내는지는 "입력 규칙"에 있다.
decisions:
  - id: d-ebfs37
    kind: product
    question: 온스크린 키보드는 어떤 배열인가
    options:
      - id: o-a9v1xs
        text: 온스크린 키보드는 두벌식 QWERTY 한글 배열의 일반 자모 버튼을 한 키보드 안에 둔다
        status: accepted
      - id: o-73gy00
        text: 온스크린 키보드는 숫자 row를 한 키보드 안에 둔다
        status: accepted
      - id: o-mxny16
        text: 온스크린 키보드는 L/R Ctrl을 한 키보드 안에 둔다
        status: accepted
      - id: o-5fhnt0
        text: 온스크린 키보드는 L/R Shift를 한 키보드 안에 둔다
        status: accepted
      - id: o-j6wkzj
        text: 온스크린 키보드는 Space를 한 키보드 안에 둔다
        status: accepted
      - id: o-z9bca3
        text: 온스크린 키보드는 마침표를 한 키보드 안에 둔다
        status: accepted
      - id: o-33n6v9
        text: 온스크린 키보드는 세미콜론을 한 키보드 안에 둔다
        status: accepted
      - id: o-r25n4h
        text: 온스크린 키보드는 Backspace를 한 키보드 안에 둔다
        status: accepted
      - id: o-vem818
        text: 온스크린 키보드는 navigation row(←, →, Home, End)를 한 키보드 안에 둔다
        status: accepted
      - id: o-rdgx1w
        text: 온스크린 키보드에는 별도 modifier 패널을 두지 않는다
        status: accepted
    status: accepted
  - id: d-zhzq5v
    kind: product
    question: 온스크린 modifier 버튼은 누를 때마다 어떻게 바뀌는가
    options:
      - id: o-vdj9kr
        text: 온스크린 modifier 버튼은 누를 때마다 off, oneshot, locked, off 순으로 순환한다
        status: accepted
      - id: o-d33xkt
        text: 온스크린 modifier 버튼은 hover만으로는 바뀌지 않는다
        status: accepted
    status: accepted
  - id: d-48fdk6
    kind: product
    question: backspace undo 후 modifier 상태는 어떻게 되는가
    options:
      - id: o-ff4fr7
        text: backspace undo 후 이미 소비된 oneshot은 되살아나지 않는다
        status: accepted
      - id: o-zpq60x
        text: backspace undo 후 locked는 유지된다
        status: accepted
    status: accepted
constraints:
  - id: c-pjwwez
    kind: product
    statement: L Ctrl과 R Ctrl, L Shift와 R Shift는 각각 동시에 활성화되지 않는다. 한쪽을 켜면 반대쪽은 off가 된다
qa:
  - id: q-pg863n
    condition: 온스크린 키보드의 글자 키는 두벌식 기본 자모(ㄱ-ㅎ, ㅏ-ㅣ)이고, 옛한글 확장 자모 전용 버튼은 없다
    verifies: [d-8xcgv2, d-qv89kh]
  - id: q-xpd3z2
    condition: 소비된 oneshot modifier는 backspace undo 후 되살아나지 않고, locked modifier는 유지된다
    verifies: [d-48fdk6, d-pgtceh]
    tests: [src/engine/tests/engine.test.ts]
implementations:
  - id: i-hmtw5r
    name: 온스크린 키보드
    status: in-progress
    plan: |
      TASK-V023-002: editor surface tap으로 OS native 키보드를 부르는 경로를 없앤다.
      하드웨어 입력용으로 남기는 숨김 텍스트 입력 요소는 inputMode="none"으로 둔다.
      키보드는 모든 모드에서 기본 펼침으로 시작하고, compact row 토글은 유지한다.
      feat/v0.2.3에 반영됐고 main 머지를 기다린다.
    refs:
      - path: src/features/ime/ui/ImeWorkbench.tsx
