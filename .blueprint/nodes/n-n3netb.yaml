title: 하드웨어 키보드
parent: n-r6q7ge
status: active
explanation: |
  물리 키보드와 OS 입력기(Windows 한글 IME 등)에서 오는 키 이벤트를 엔진 입력으로 해석하는 adapter. 화면 키보드는 형제 노드 "온스크린 키보드"에, 두 경로가 겹칠 때의 처리는 "중복 입력 억제"에 있다.
decisions:
  - id: d-we0xg7
    kind: product
    question: 하드웨어 키 입력 중 무엇을 엔진 조합 입력으로 보는가
    chosen: 실제 한글 자모 key value(ㄱ, ㅏ, ㄴ 등)가 들어온 경우만 조합 입력으로 본다. 영문 QWERTY 물리 키는 두벌식으로 치환하지 않고, 로마자와 외국어 입력은 literal로 통과시킨다
    status: accepted
  - id: d-720vg1
    kind: product
    question: Windows 한글 IME의 Process keydown을 어떻게 처리하는가
    chosen: 바로 치환하지 않고 보류한다. 이어지는 composition 데이터가 한글일 때만 보류한 물리 키를 엔진 입력으로 확정하고, 한글이 아니면 버리고 native literal 경로에 맡긴다
    alternatives:
      - option: Process keydown을 물리 키 기준 두벌식으로 즉시 치환
        rejected-reason: v0.2.3 첫 시도에서 일본어와 중국어 IME 입력까지 한글로 바뀌어 롤백되었다
    rationale: Windows 한글 IME가 켜진 상태에서도 하드웨어 키보드로 옛한글을 입력하되, 한글이 아닌 IME 입력은 건드리지 않기 위해서다 (REQ-V023-001)
    status: accepted
qa:
  - id: q-x3ervk
    condition: Windows 한글 IME 이벤트 시퀀스(Process + 한글 composition)로 ᄢᅮᆯ이 재현되고, Shift 쌍자모와 Backspace undo도 같은 결과를 낸다
    verifies: [d-720vg1, d-pgtceh]
    tests: [src/features/ime/services/hardwareKeyboard.test.ts]
  - id: q-982yqe
    condition: 일본어와 중국어 IME 이벤트 시퀀스(Process + 비한글 composition)는 literal 그대로 입력된다
    verifies: [d-720vg1, d-we0xg7]
    tests: [src/features/ime/services/hardwareKeyboard.test.ts]
  - id: q-g685x6
    condition: 한글 자모가 아닌 로마자 key value는 두벌식으로 바뀌지 않고 literal로 입력된다
    verifies: [d-we0xg7, d-8xcgv2]
    tests: [src/engine/tests/engine.test.ts]
  - id: q-6hcd3d
    condition: 하드웨어 Ctrl 조합은 event.key가 자모가 아니어도 물리 키 기준으로 Modifier 규칙(n-bf2mwe)의 Ctrl 결과를 낸다. 편집기에 selection이 있을 때 Ctrl + C는 입력을 만들지 않는다
    verifies: [n-bf2mwe]
    tests: [src/features/ime/services/hardwareKeyboard.test.ts]
implementation:
  status: in-progress
  plan: |
    TASK-V023-003: 물리 키(event.code)를 두벌식 자모로 바꾸는 shift-aware resolver를 둔다.
    Windows 한글 IME의 Process keydown은 보류하고, 이어지는 composition이 한글일 때만 엔진 입력으로 확정한다.
    Ctrl 조합은 물리 키 기준으로 해석하고, selection이 있는 Ctrl + C는 복사에 양보한다.
    feat/v0.2.3에 반영됐고 main 머지를 기다린다.
  refs:
    - path: src/features/ime/services/hardwareKeyboard.ts
    - path: src/features/ime/services/keyboardMode.ts
