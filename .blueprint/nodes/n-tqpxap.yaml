title: 입력 규칙
parent: n-h0vywr
from-decision: d-qv89kh
status: active
explanation: |
  특수 자모를 개별 버튼으로 노출하지 않기로 한 결정(d-qv89kh)에서 나온 노드다. 직접 입력은 기본 자모로 제한하고, 나머지는 순차 입력과 modifier로 만든다.

  출처: docs/handoff/decisions.md의 "Input Rule Policy"와 "Keyboard Policy", docs/specs/active/target-scope.md의 "Clarified Input Strategy", docs/specs/active/input-rules.md.
decisions:
  - id: d-8xcgv2
    question: 무엇을 직접 입력 대상으로 두는가
    chosen: 일반 키보드로 칠 수 있는 기본 자모(ㄱ-ㅎ, ㅏ-ㅣ)만 직접 입력한다. 나머지 옛한글 확장 자모는 L/R Ctrl, L/R Shift modifier 조합으로 만든다
    status: accepted
  - id: d-0dsbdg
    question: 병서와 복합 중성은 어떻게 만드는가
    chosen: 가능한 한 입력 이력 기반의 순차 입력으로 자동 승격한다. 필요한 경우에만 filler나 문맥형 매크로로 보조한다. 현대 한글 기본 조합을 엔진 기본층에 두고 그 위에 옛한글 특수 규칙을 얹는다
    status: accepted
qa:
  - id: q-x68d4y
    condition: ㅂ + ㅅ + ㄱ + ㅜ + ㄹ 입력이 ᄢᅮᆯ이 되고, ㄱ + ㅠ + ㅏ + ㄴ 입력이 ᄀᆎᆫ이 된다
    verifies: [d-0dsbdg]
    tests: [src/engine/tests/engine.test.ts]
