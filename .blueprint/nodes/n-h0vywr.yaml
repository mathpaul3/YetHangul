title: YetHangul 옛한글 웹 입력기
status: active
explanation: |
  어떤 OS와 브라우저에서도 현대 한글 자모와 modifier 조합으로 옛한글을 입력하게 하는 웹 입력기. 아래에 입력 규칙(키와 조합이 무엇을 내는가), 입력 수집(키보드와 IME에서 입력을 받는 방식), 입력 엔진(음절 조합), 입력 결과창 편집기가 있다.
decisions:
  - id: d-2dny9d
    kind: product
    question: 옛한글 조합을 누가 수행하는가
    options:
      - id: o-63c1ak
        text: 옛한글 조합은 OS 기본 입력기에 의존하지 않고 웹 앱 내부 입력 엔진이 직접 조합한다
        status: accepted
    rationale: |
      어떤 OS와 브라우저에서도 같은 규칙으로 옛한글을 입력할 수 있게 하기 위해서다
    status: accepted
  - id: d-e1ytc6
    kind: product
    question: 지원할 옛한글 범위는 어디까지인가
    options:
      - id: o-f8j901
        text: 지원할 옛한글 범위는 문자 집합 위키의 "유니코드 옛한글 1638750자" 기준으로 초성 125자, 중성 95자, 종성 138자 전체다
        status: accepted
      - id: o-s514xr
        text: 초성, 중성, 종성 중 한 성분 이상이 없는 경우도 지원 범위에 포함한다
        status: accepted
    status: accepted
  - id: d-qv89kh
    kind: product
    question: 옛한글 특수 자모를 개별 버튼이나 직접 키로 노출하는가
    options:
      - id: o-q5vrfy
        text: 옛한글 특수 자모를 개별 버튼이나 직접 키로 노출하지 않는다
        status: accepted
      - id: o-fs5sxy
        text: 특수 자모 전용 팔레트도 두지 않는다
        status: accepted
      - id: o-b1d1my
        text: 옛한글 특수 자모는 일반 자모 직접 입력과 modifier 조합으로 만든다
        status: accepted
    rationale: |
      입력 버튼 집합을 최대한 단순하게 유지하기 위해서다
    non-goal: true
    status: accepted
  - id: d-n6y559
    kind: operation
    question: 버전은 어떻게 올리는가
    options:
      - id: o-my6g5f
        text: 1.0 전에는 0.MINOR.PATCH를 쓴다
        status: accepted
      - id: o-d2n1qa
        text: 버전은 커밋마다 올리지 않고 릴리스 가능한 단위가 모였을 때만 올린다
        status: accepted
      - id: o-cawvnk
        text: 릴리스 커밋에 같은 버전의 vX.Y.Z 태그를 붙인다
        status: accepted
    status: accepted
  - id: d-ytny7h
    kind: operation
    question: 배포는 어떻게 시작하는가
    options:
      - id: o-527m32
        text: 배포는 태그 push로 시작한다
        status: accepted
    status: accepted
  - id: d-ttm6dj
    kind: practice
    question: 여러 에이전트가 함께 일할 때 커밋은 누가 하는가
    options:
      - id: o-8e5t2w
        text: 여러 에이전트가 함께 일할 때 기본적으로 coordinator가 커밋 권한을 가진다
        status: accepted
    status: accepted
  - id: d-jwa4tk
    kind: practice
    question: 여러 에이전트가 함께 일할 때 subagent는 어디서 작업하는가
    options:
      - id: o-d4d4b6
        text: subagent는 서로 겹치지 않는 쓰기 범위 안에서만 작업한다
        status: accepted
    status: accepted
constraints:
  - id: c-5re0zw
    kind: product
    statement: 같은 key sequence는 항상 같은 Unicode 출력으로 수렴한다 (입력 보존성)
  - id: c-mgy0y6
    kind: product
    statement: 목표 inventory 초성 125, 중성 95, 종성 138 전체가 primitive 또는 automatic rule 경로 중 하나로 설명된다 (전 범위 커버리지)
qa:
  - id: q-t92844
    condition: inventory coverage가 초성 125/125, 중성 95/95, 종성 138/138이고 missing sample이 없다
    verifies: [d-e1ytc6, c-mgy0y6]
    tests: [src/engine/tests/engine.test.ts]
  - id: q-gzc3et
    condition: 모든 릴리스 커밋에 같은 버전의 vX.Y.Z 태그가 있다
    verifies: [d-n6y559]
implementations:
  - id: i-jevktj
    name: 그래프로 옮기지 않은 정책
    status: planned
    plan: |
      아직 그래프로 옮기지 않은 정책: 폰트, 배포, analytics, 반응형 구간, product shell.
      필요해질 때 하나씩 옮기고, 옮긴 정책은 이 목록에서 뺀다. 모두 옮기면 implemented로 바꾼다.
