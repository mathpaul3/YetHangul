title: 입력 결과창 편집기
parent: n-h0vywr
status: active
explanation: |
  입력 결과창에서 문서, caret, 선택, 복사, 포커스를 다루는 부분. 조합 중인 음절은 "입력 엔진"이, 키 입력을 받는 일은 "입력 수집 파이프라인"이 맡는다.
decisions:
  - id: d-rr9gsa
    kind: practice
    question: 입력 결과창의 편집 상태를 어떻게 표현하는가
    options:
      - id: o-f2t4n1
        text: 입력 결과창의 편집 상태는 입력기 위에 document units + caret index + selection range 레이어를 두어 표현한다
        status: accepted
    status: accepted
  - id: d-8p80c2
    kind: product
    question: 입력 결과창에서 선택과 복사는 어떻게 하는가
    options:
      - id: o-gjqkfb
        text: 브라우저 기본 selection은 가능한 한 배제한다
        status: accepted
      - id: o-sjjzdc
        text: 입력 결과창에서 자체 selection을 우선한다
        status: accepted
      - id: o-em89rn
        text: 입력 결과창에서 Copy All 버튼을 우선한다
        status: accepted
      - id: o-5cxkpd
        text: 입력 결과창에서 Copy Selection 버튼을 우선한다
        status: accepted
    rationale: |
      입력 요소의 기본 동작을 그대로 두면 조합형 글자가 쪼개져 선택되는 등 선택이 기대와 다르게 동작하는 경우가 많아 자체 selection을 둔다. 모바일 사용자도 편하게 복사할 수 있게 복사 기능은 버튼으로 제공한다
    status: accepted
  - id: d-jw893q
    kind: product
    question: 편집기에서 포커스가 빠지면 조합 중이던 내용은 어떻게 되는가
    options:
      - id: o-fgbvj2
        text: 편집기에서 포커스가 빠지면 composition buffer를 먼저 document에 commit한다
        status: accepted
      - id: o-f19sn9
        text: commit한 뒤 하드웨어 상호작용 상태를 초기화한다
        status: accepted
      - id: o-ygbpx2
        text: commit한 뒤 최근 IME 중복 표시를 초기화한다
        status: accepted
    status: accepted
qa:
  - id: q-54hx86
    condition: 조합 중에 편집기 포커스가 빠져도 조합 중이던 글자가 document에 남는다
    verifies: [d-jw893q]
implementations:
